<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="CannaClicker event seed-pack">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="brushRough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".032" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkBleed" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".55" result="blur"/>
      <feOffset dy=".45" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values=".18"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="leafGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4ffe3"/>
      <stop offset=".18" stop-color="#caff58"/>
      <stop offset=".58" stop-color="#19c96f"/>
      <stop offset="1" stop-color="#0c7f46"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".55" stop-color="#ffd15a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8fff8" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#76ffd0" stop-opacity=".72"/>
      <stop offset="1" stop-color="#71c7ff" stop-opacity=".48"/>
    </linearGradient>
  </defs>
  <g filter="url(#softShadow)">
      <path d="M64 7c14 2 33 11 45 25 6 17 2 39-6 55-12 17-25 28-39 34-18-6-33-17-44-36-7-18-5-38 3-55C35 18 49 9 64 7Z" fill="#050b08" stroke="#ffd15a" stroke-width="4.6" stroke-linejoin="round" filter="url(#brushRough)"/>
      <path d="M64 15c12 2 27 10 36 21 4 13 2 30-5 43-9 13-20 22-31 27-14-5-26-13-35-28-5-14-4-29 2-42 9-10 21-18 33-21Z" fill="#10251a" opacity=".96"/>
      <path d="M31 37c10-11 22-17 34-18 10 2 20 7 29 14-18-3-38 2-62 16Z" fill="#ffd15a" opacity=".13"/>
      <path d="M25 83c12 20 24 29 39 35 15-7 27-17 39-34-22 11-52 13-78-1Z" fill="#000" opacity=".2"/>
      <g filter="url(#inkBleed)"><path d="M39 42h50l-5 50H44Z" fill="#ffd15a" stroke="#f7ffe8" stroke-width="4" stroke-linejoin="round"/><path d="M48 55h32" stroke="#19c96f" stroke-width="5"/><ellipse cx="64" cy="73" rx="11" ry="16" fill="#caff58" stroke="#07130d" stroke-width="2"/></g>
      <path d="M34 96c16 12 43 12 60-1" fill="none" stroke="#ffd15a" stroke-width="3.4" stroke-linecap="round" opacity=".72"/>
      <path d="M37 30c9-7 18-11 28-12M94 42c5 11 5 23 0 36M31 76c-4-14-3-26 2-38" fill="none" stroke="#f7ffe8" stroke-width="1.6" stroke-linecap="round" opacity=".34"/>
      <circle cx="33" cy="92" r="1.8" fill="#ffd15a" opacity=".62"/>
      <circle cx="101" cy="37" r="1.4" fill="#f7ffe8" opacity=".45"/>
      <circle cx="50" cy="22" r="1.1" fill="#f7ffe8" opacity=".35"/>
    </g>
</svg>